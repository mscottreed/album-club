# This is a Declarative Automation Bundle definition for album_club.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: album_club
  uuid: 5c59e6df-93f0-4a4a-a90a-ac84216a6413

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  secret_scope:
    description: Secret scope for API credentials
    default: album_club
  warehouse_id:
    description: SQL warehouse the dashboard runs on (Free Edition has one)
    lookup:
      warehouse: Serverless Starter Warehouse
  ci_service_principal:
    description: Application ID of the album-club-ci service principal that GitHub Actions deploys prod as
    default: fc6dd84e-5cda-40d2-81db-865f13b5b731

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-eebf3c2f-dab5.cloud.databricks.com
    variables:
      catalog: workspace
      secret_scope: dev_${workspace.current_user.short_name}_album_club
  prod:
    mode: production
    workspace:
      host: https://dbc-eebf3c2f-dab5.cloud.databricks.com
      # Prod always lives in the CI service principal's folder, whoever deploys it,
      # so there's only ever one copy.
      root_path: /Workspace/Users/${var.ci_service_principal}/.bundle/${bundle.name}/${bundle.target}
    # Jobs run as the CI service principal, not as whoever deployed them.
    run_as:
      service_principal_name: ${var.ci_service_principal}
    variables:
      catalog: workspace
    permissions:
      - service_principal_name: ${var.ci_service_principal}
        level: CAN_MANAGE
      - group_name: admins
        level: CAN_MANAGE
