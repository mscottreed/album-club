name: CI

on:
  push:
    branches:
      - "post-*"
      - v2-from-scratch
  workflow_dispatch:

# The CLI, the SDK and Databricks Connect all read these to authenticate as the
# album-club-ci service principal. See posts/02-cicd-with-github-actions.md.
env:
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: databricks/setup-cli@v1.23.0
        with:
          version: 1.24.0

      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Check formatting
        run: uv run ruff format --check
      - name: Validate bundle
        run: databricks bundle validate -t prod
      - name: Test
        run: uv run pytest

  deploy:
    needs: check
    if: github.ref == 'refs/heads/v2-from-scratch'
    runs-on: ubuntu-latest
    concurrency: prod-deploy
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@v1.23.0
        with:
          version: 1.24.0

      - name: Deploy to prod
        run: databricks bundle deploy -t prod
