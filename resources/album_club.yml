resources:
  schemas:
    album_club:
      catalog_name: ${var.catalog}
      name: album_club
      comment: Album club data, from raw OneNote exports to gold tables.
      # In prod the CI service principal owns the schema, so I need a grant to upload exports and
      # query tables. Grants on a schema apply to its volumes and tables too. The schema holds the
      # raw export, with full names, so the grant goes to me, not to club members. Each deploy sets
      # the schema's grants to exactly this list.
      grants:
        - principal: ${var.admin_user}
          privileges: [USE_SCHEMA, SELECT, READ_VOLUME, WRITE_VOLUME]
        # The ratings app's resources grant its service principal USE_SCHEMA here, but each deploy
        # sets this schema's grants back to this list and drops it, so it has to be listed too.
        - principal: ${resources.apps.ratings_app.service_principal_client_id}
          privileges: [USE_SCHEMA]

  volumes:
    onenote_exports:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.album_club.name}
      name: onenote_exports
      comment: OneNote sections exported from Windows OneNote as Single File Web Page (.mht), plus ratings tables (ratings_tables/) and meetings (meetings/) pasted from OneNote or saved by the ratings app.

    api_responses:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.album_club.name}
      name: api_responses
      comment: Raw Spotify and MusicBrainz responses as JSON lines, written by the fetch_enrichment job task.

  pipelines:
    album_club_pipeline:
      name: album_club
      catalog: ${var.catalog}
      schema: ${resources.schemas.album_club.name}
      serverless: true
      # src/ is on the pipeline's Python path, so transformations can import album_club.
      root_path: ../src
      libraries:
        - glob:
            include: ../src/pipeline/**
      environment:
        dependencies:
          - beautifulsoup4>=4.15.0
      configuration:
        album_club.onenote_exports_path: /Volumes/${var.catalog}/${resources.schemas.album_club.name}/${resources.volumes.onenote_exports.name}
        album_club.api_responses_path: /Volumes/${var.catalog}/${resources.schemas.album_club.name}/${resources.volumes.api_responses.name}

  secret_scopes:
    album_club_secrets:
      # Development mode doesn't prefix scope names, so dev sets its own name (databricks.yml).
      # The scope is defined here; the values aren't: see docs/secrets.md.
      name: ${var.secret_scope}

  jobs:
    album_club_refresh:
      name: album_club_refresh
      # The ratings app's resources let its service principal start this job, but in prod each
      # deploy sets the job's permissions back to the target's list and drops it, so it's listed here.
      permissions:
        - service_principal_name: ${resources.apps.ratings_app.service_principal_client_id}
          level: CAN_MANAGE_RUN
      # Each save in the app starts this job. The weekly run picks up any save whose refresh
      # didn't start, the morning after the meeting, when the free daily compute limit has reset.
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Los_Angeles
      # Spotify and MusicBrainz lookups sit between two pipeline updates: the first builds
      # silver_listens, the fetch writes API responses to the api_responses volume, and the
      # second loads them into bronze and matches each listen using only those responses.
      tasks:
        - task_key: parse_pages
          pipeline_task:
            pipeline_id: ${resources.pipelines.album_club_pipeline.id}
        - task_key: fetch_enrichment
          depends_on:
            - task_key: parse_pages
          spark_python_task:
            python_file: ../src/fetch_enrichment.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.album_club.name}
              - --responses-path=/Volumes/${var.catalog}/${resources.schemas.album_club.name}/${resources.volumes.api_responses.name}
              - --secret-scope=${resources.secret_scopes.album_club_secrets.name}
          environment_key: serverless
        - task_key: match
          depends_on:
            - task_key: fetch_enrichment
          pipeline_task:
            pipeline_id: ${resources.pipelines.album_club_pipeline.id}
        # The dashboard caches its results for up to a day, and new data doesn't clear the cache,
        # so the last step reruns its queries.
        - task_key: refresh_dashboard
          depends_on:
            - task_key: match
          dashboard_task:
            dashboard_id: ${resources.dashboards.album_club_dashboard.id}
            warehouse_id: ${var.warehouse_id}
      environments:
        - environment_key: serverless
          spec:
            environment_version: "6"
